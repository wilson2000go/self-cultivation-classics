<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听读主页 · 后台管理</title>
<style>
  :root{ --bg:#f6f2e9; --card:#fffdf8; --ink:#3a3226; --line:#e7ddc8; --accent:#9a6b3f; --accent2:#c79a5b; --ok:#3a8a4f; --bad:#b5472f; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:var(--card); border-bottom:1px solid var(--line); padding:14px 20px; position:sticky; top:0; z-index:5; }
  header h1{ margin:0 0 10px; font-size:18px; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .toolbar input[type=password], .toolbar input[type=text]{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:#fff; }
  .toolbar input#token{ flex:1; min-width:220px; }
  button{ cursor:pointer; border:none; border-radius:8px; padding:8px 14px; font-size:13px; background:var(--accent); color:#fff; transition:.15s; }
  button:hover{ background:var(--accent2); }
  button.ghost{ background:#efe7d6; color:var(--ink); }
  button.ghost:hover{ background:#e3d8c0; }
  button.sm{ padding:5px 9px; font-size:12px; }
  main{ max-width:920px; margin:0 auto; padding:20px; }
  .hint{ font-size:12px; color:#8a7d66; margin:6px 0 16px; line-height:1.6; }
  .book{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:12px; display:flex; gap:14px; align-items:flex-start; }
  .book.hidden{ opacity:.5; }
  .book .cover{ width:64px; height:84px; object-fit:cover; border-radius:8px; background:#efe9dc; flex:none; }
  .book .body{ flex:1; min-width:0; }
  .book .title{ font-size:15px; font-weight:600; }
  .book .meta{ font-size:12px; color:#8a7d66; margin:4px 0 8px; }
  .book .controls{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .switch{ display:inline-flex; align-items:center; gap:6px; font-size:12px; }
  .status{ font-size:12px; margin-top:10px; padding:8px 12px; border-radius:8px; display:none; }
  .status.show{ display:block; }
  .status.ok{ background:#e7f3ea; color:var(--ok); }
  .status.bad{ background:#f7e6e1; color:var(--bad); }
  .status.info{ background:#eef1f6; color:#3a5a8a; }
  /* login overlay */
  #login{ position:fixed; inset:0; background:rgba(40,34,24,.55); display:flex; align-items:center; justify-content:center; z-index:50; }
  #login .box{ background:#fff; padding:26px 28px; border-radius:14px; width:300px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  #login h2{ margin:0 0 4px; font-size:17px; }
  #login p{ font-size:12px; color:#8a7d66; margin:0 0 16px; }
  #login input{ width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; margin-bottom:12px; font-size:14px; }
  /* modal */
  #modal{ position:fixed; inset:0; background:rgba(40,34,24,.55); display:none; align-items:center; justify-content:center; z-index:40; }
  #modal.show{ display:flex; }
  #modal .box{ background:#fff; padding:22px 24px; border-radius:14px; width:480px; max-width:92vw; max-height:88vh; overflow:auto; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  #modal h3{ margin:0 0 14px; font-size:16px; }
  #modal label{ display:block; font-size:12px; color:#8a7d66; margin:10px 0 4px; }
  #modal input, #modal textarea{ width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; font-family:inherit; }
  #modal textarea{ resize:vertical; min-height:60px; }
  #modal .row{ display:flex; gap:10px; }
  #modal .row > div{ flex:1; }
  #modal .actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <h2>后台登录</h2>
    <p>请输入管理密码</p>
    <input id="passInput" type="password" placeholder="管理密码" autocomplete="off">
    <button style="width:100%" onclick="doLogin()">进入</button>
  </div>
</div>

<header>
  <h1>📚 听读主页 · 后台管理</h1>
  <div class="toolbar">
    <input id="token" type="password" placeholder="GitHub 个人访问令牌 (PAT，仅存于本浏览器 localStorage，用于写回 data.json)">
    <button class="ghost" onclick="saveToken()">保存令牌</button>
    <button onclick="loadData()">↻ 读取书目</button>
  </div>
</header>

<main>
  <p class="hint">
    说明：本站为纯静态页面，没有服务器数据库。改动通过 GitHub 接口直接写回仓库里的
    <code>data.json</code>，GitHub Pages 会自动重新发布（通常 1 分钟内生效）。<br>
    ① 在上方填入你的 GitHub PAT（需 <code>repo</code> 权限）并点「保存令牌」；② 点「读取书目」加载现有数据；
    ③ 调整显隐 / 排序 / 编辑。<b>开启「自动保存」后，任何改动会在 1.5 秒后自动推送到 GitHub，无需手工上传</b>；
    若未填令牌，自动保存会跳过，可用「下载 data.json」手动提交。
  </p>

  <div id="list"></div>

  <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px;">
    <label class="switch"><input type="checkbox" id="autoSave" checked onchange="autoSaveChanged(this.checked)"> 自动保存（改动后自动推送到 GitHub）</label>
    <button onclick="addBook()">＋ 新增书籍</button>
    <button class="ghost" onclick="downloadJson()">⬇ 下载 data.json</button>
    <button onclick="publish('手动保存')">💾 保存并发布</button>
  </div>

  <div id="status" class="status"></div>
</main>

<div id="modal">
  <div class="box">
    <h3 id="modalTitle">编辑书籍</h3>
    <label>书名 title</label>
    <input id="f_title" type="text">
    <label>著 / 讲 author</label>
    <input id="f_author" type="text">
    <label>原著 / 出处 original</label>
    <input id="f_original" type="text">
    <label>简介 desc（可含 HTML，如 &lt;b&gt;加粗&lt;/b&gt;）</label>
    <textarea id="f_desc"></textarea>
    <label>封面图 URL cover（留空则无封面）</label>
    <input id="f_cover" type="text" placeholder="https://.../cover.jpg">
    <label>唯一标识 id（用于文件夹与音频路径，建议英文短横，勿改已上线的）</label>
    <input id="f_id" type="text">
    <div class="row">
      <div>
        <label>显示 visible</label>
        <select id="f_visible" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;">
          <option value="true">显示</option>
          <option value="false">隐藏</option>
        </select>
      </div>
      <div>
        <label>排序 order（越小越靠前）</label>
        <input id="f_order" type="number">
      </div>
    </div>
    <label>音频段数 tracks（只读，新增/修改音频请重新抽取）</label>
    <input id="f_tracks" type="text" disabled>
    <div class="actions">
      <button class="ghost" onclick="closeModal()">取消</button>
      <button id="modalSave" onclick="saveEdit()">保存</button>
    </div>
  </div>
</div>

<script>
/* ===================== 配置区（可按需修改） ===================== */
const OWNER = 'wilson2000go';
const REPO  = 'self-cultivation-classics';
const BRANCH = 'main';
const FILE  = 'data.json';
const ADMIN_PASS = 'areading2026';   // ← 上线前请改成你自己的密码
/* ============================================================== */

let books = [];          // 当前编辑中的书目数组
let editIdx = -1;        // 正在编辑的书目下标（-1 表示新增）
let autoSaveEnabled = true;
let saveTimer = null;    // 自动保存防抖计时器

/* ---------- 登录 ---------- */
function doLogin(){
  const v = document.getElementById('passInput').value;
  if(v === ADMIN_PASS){
    document.getElementById('login').style.display = 'none';
    const t = localStorage.getItem('gh_token');
    if(t) document.getElementById('token').value = t;
  }else{
    alert('密码错误');
  }
}

/* ---------- 工具 ---------- */
function setStatus(msg, type){
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status show ' + (type||'info');
}
function b64encodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64decodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}

/* ---------- 令牌 ---------- */
function saveToken(){
  const t = document.getElementById('token').value.trim();
  if(!t){ setStatus('令牌为空，未保存。', 'bad'); return; }
  localStorage.setItem('gh_token', t);
  setStatus('令牌已保存到本浏览器 localStorage。', 'ok');
}
function getToken(){
  return (document.getElementById('token').value.trim() || localStorage.getItem('gh_token') || '');
}

/* ---------- 自动保存 ---------- */
function autoSaveChanged(v){
  autoSaveEnabled = v;
  setStatus(v ? '已开启自动保存：改动后约 1.5 秒自动推送。' : '已关闭自动保存，需手动点「保存并发布」。', 'info');
}
function scheduleAutoSave(){
  if(!autoSaveEnabled) return;
  if(!getToken()){
    setStatus('未配置 GitHub 令牌，自动保存已跳过；请先填写并保存令牌，或手动点「保存并发布」下载。', 'bad');
    return;
  }
  setStatus('改动已记录，1.5 秒后自动保存…', 'info');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ publish('自动保存'); }, 1500);
}

/* ---------- 读取书目（优先本地 data.json，再尝试 GitHub） ---------- */
async function loadData(){
  const token = getToken();
  if(token){
    setStatus('正在从 GitHub 读取 '+FILE+' …', 'info');
    try{
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}?ref=${BRANCH}`, {
        headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json' }
      });
      if(!r.ok) throw new Error('GitHub API '+r.status+' '+ (await r.text()).slice(0,120));
      const j = await r.json();
      books = JSON.parse(b64decodeUtf8(j.content)).books || [];
      normalize();
      render();
      setStatus('已从 GitHub 读取 '+books.length+' 本书。', 'ok');
      return;
    }catch(e){
      setStatus('GitHub 读取失败（'+e.message+'），回退到本地 data.json。', 'bad');
    }
  }
  // 回退：本地 data.json（适合纯本地编辑后手动上传）
  try{
    const r = await fetch(FILE, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    books = (await r.json()).books || [];
    normalize(); render();
    setStatus('已从本地 data.json 读取 '+books.length+' 本书（未用 GitHub 令牌，保存将走下载方式）。', 'info');
  }catch(e){
    setStatus('读取失败：'+e.message, 'bad');
  }
}

function normalize(){
  books.forEach((b,i)=>{
    if(typeof b.visible === 'undefined') b.visible = true;
    if(typeof b.order === 'undefined') b.order = i+1;
    if(typeof b.cover === 'undefined') b.cover = '';
  });
}

/* ---------- 渲染列表 ---------- */
function render(){
  const wrap = document.getElementById('list');
  wrap.innerHTML = '';
  // 按 order 排序展示
  const sorted = books.map((b,i)=>({b,i})).sort((a,b)=>(a.b.order??999)-(b.b.order??999));
  sorted.forEach(({b,origIdx})=>{
    const div = document.createElement('div');
    div.className = 'book' + (b.visible===false ? ' hidden':'');
    const coverHtml = b.cover ? `<img class="cover" src="${b.cover}" alt="">` : `<div class="cover"></div>`;
    div.innerHTML = `
      ${coverHtml}
      <div class="body">
        <div class="title">《${escapeHtml(b.title||'')}》${b.visible===false?' · <span style="color:#b5472f">已隐藏</span>':''}</div>
        <div class="meta">著/讲：${escapeHtml(b.author||'')} ｜ ${ (b.tracks||[]).length } 段音频 ｜ order=${b.order}</div>
        <div class="controls">
          <label class="switch"><input type="checkbox" ${b.visible!==false?'checked':''} onchange="toggleVisible(${origIdx}, this.checked)"> 显示</label>
          <button class="sm ghost" onclick="move(${origIdx},-1)">↑ 上移</button>
          <button class="sm ghost" onclick="move(${origIdx},1)">↓ 下移</button>
          <button class="sm" onclick="openEdit(${origIdx})">✎ 编辑</button>
          <button class="sm ghost" onclick="removeBook(${origIdx})">🗑 删除</button>
        </div>
      </div>`;
    wrap.appendChild(div);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- 操作 ---------- */
function toggleVisible(idx, val){ books[idx].visible = val; render(); scheduleAutoSave(); }
function move(idx, dir){
  const arr = books.map((b,i)=>({b,i})).sort((a,b)=>(a.b.order??999)-(b.b.order??999));
  const pos = arr.findIndex(x=>x.i===idx);
  const swap = pos+dir;
  if(pos<0 || swap<0 || swap>=arr.length) return;
  const o1 = arr[pos].b.order ?? pos+1;
  const o2 = arr[swap].b.order ?? swap+1;
  arr[pos].b.order = o2; arr[swap].b.order = o1;
  render(); scheduleAutoSave();
}
function removeBook(idx){
  if(!confirm('确定删除《'+(books[idx].title||'')+'》？此操作保存后生效。')) return;
  books.splice(idx,1); render(); scheduleAutoSave();
}
function addBook(){
  const id = 'new-book-' + Date.now();
  books.push({ id, title:'新书籍', author:'', original:'', desc:'', cover:'', visible:true, order:books.length+1, tracks:[] });
  openEdit(books.length-1);
}

/* ---------- 编辑弹窗 ---------- */
function openEdit(idx){
  editIdx = idx;
  const b = books[idx];
  document.getElementById('modalTitle').textContent = idx<0 ? '新增书籍' : '编辑《'+(b.title||'')+'》';
  document.getElementById('f_title').value = b.title||'';
  document.getElementById('f_author').value = b.author||'';
  document.getElementById('f_original').value = b.original||'';
  document.getElementById('f_desc').value = b.desc||'';
  document.getElementById('f_cover').value = b.cover||'';
  document.getElementById('f_id').value = b.id||'';
  document.getElementById('f_visible').value = (b.visible!==false).toString();
  document.getElementById('f_order').value = b.order??'';
  document.getElementById('f_tracks').value = (b.tracks||[]).length + ' 段';
  document.getElementById('modal').classList.add('show');
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); editIdx=-1; }
function saveEdit(){
  if(editIdx<0) return;
  const b = books[editIdx];
  b.title = document.getElementById('f_title').value.trim();
  b.author = document.getElementById('f_author').value.trim();
  b.original = document.getElementById('f_original').value.trim();
  b.desc = document.getElementById('f_desc').value;
  b.cover = document.getElementById('f_cover').value.trim();
  b.id = document.getElementById('f_id').value.trim();
  b.visible = document.getElementById('f_visible').value === 'true';
  b.order = parseInt(document.getElementById('f_order').value,10) || books.length+1;
  if(!b.id){ setStatus('id 不能为空。', 'bad'); return; }
  closeModal(); render();
  setStatus('已更新《'+b.title+'》，自动保存中…', 'ok');
  scheduleAutoSave();
}

/* ---------- 保存 ---------- */
function buildPayload(){
  // 保存时按 order 重排并连续编号，保证前台顺序稳定
  const sorted = [...books].sort((a,b)=>(a.order??999)-(b.order??999));
  sorted.forEach((b,i)=> b.order = i+1);
  return { books: sorted };
}
function downloadJson(){
  const data = buildPayload();
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click();
  setStatus('已导出 data.json，可手动上传到仓库根目录。', 'info');
}
async function publish(label){
  label = label || '保存';
  const token = getToken();
  const data = buildPayload();
  const content = b64encodeUtf8(JSON.stringify(data,null,2));
  if(!token){
    if(label === '自动保存'){ setStatus('未配置 GitHub 令牌，自动保存已跳过；请先填写并保存令牌。', 'bad'); return; }
    setStatus('未填写 GitHub 令牌，已改为下载 data.json，请手动提交到仓库。', 'bad');
    downloadJson(); return;
  }
  setStatus((label==='自动保存'?'自动':'')+'正在获取 '+FILE+' 最新 sha …', 'info');
  try{
    const getR = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}?ref=${BRANCH}`, {
      headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json' }
    });
    if(!getR.ok) throw new Error('获取文件失败 '+getR.status);
    const j = await getR.json();
    const putR = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE}`, {
      method:'PUT',
      headers:{ 'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' },
      body: JSON.stringify({
        message: 'admin: 更新书目 data.json',
        content,
        sha: j.sha,
        branch: BRANCH
      })
    });
    if(!putR.ok) throw new Error('写入失败 '+putR.status+' '+ (await putR.text()).slice(0,160));
    setStatus('✅ 已'+(label==='自动保存'?'自动':'')+'发布到 GitHub，GitHub Pages 通常 1 分钟内自动更新。', 'ok');
  }catch(e){
    setStatus((label==='自动保存'?'自动':'')+'发布失败：'+e.message, 'bad');
  }
}

/* 回车登录 */
document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
</script>
</body>
</html>
